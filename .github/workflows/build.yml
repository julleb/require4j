name: Build

on:
  push:
    branches:
      - main

jobs:
  build:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v5
        - uses: actions/setup-java@v6
          with:
            java-version: '21'
            distribution: 'temurin'
            cache: maven
        - run: mvn clean verify